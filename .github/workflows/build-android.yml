name: Build P-Hslice APK

on:
  workflow_dispatch:
    inputs:
      pslice_ref:
        description: "Rama o tag de P-Slice a usar como base"
        default: "master"
  push:
    branches: [main, master]
    paths-ignore: ["**.md"]

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      HXCPP_COMPILE_CACHE: ${{ github.workspace }}/.hxcpp
      ANDROID_HOME: "/usr/local/lib/android/sdk"
    steps:
      - name: Tu repositorio (capa P-Hslice)
        uses: actions/checkout@v4

      - name: Descargar P-Slice (Psych Engine + V-Slice ya fusionados)
        run: git clone --depth 1 --branch "${{ github.event.inputs.pslice_ref || 'master' }}" https://github.com/Psych-Slice/P-Slice.git pslice

      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Aceptar licencias y configurar SDK
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses || true

      - name: NDK r27c
        id: ndk
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip -q android-ndk-r27c-linux.zip
          mkdir -p $ANDROID_HOME/ndk
          mv android-ndk-r27c $ANDROID_HOME/ndk/27.c
          echo "ndk-path=$ANDROID_HOME/ndk/27.c" >> $GITHUB_OUTPUT
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.c" >> $GITHUB_ENV
          rm android-ndk-r27c-linux.zip

      - uses: actions/cache@v4
        with:
          path: .hxcpp
          key: hxcpp-${{ runner.os }}-${{ github.run_id }}
          restore-keys: hxcpp-${{ runner.os }}-

      - name: Plataformas de Android SDK
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          sdkmanager "platforms;android-34" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0"

      - name: Librerías de P-Slice (script oficial de P-Slice)
        working-directory: pslice/setup
        run: |
          haxelib setup ~/haxelib
          chmod +x *.sh
          if [ -f "unix.sh" ]; then
            yes | ./unix.sh
          elif [ -f "Unix.sh" ]; then
            yes | ./Unix.sh
          else
            yes | ./setup.sh
          fi

      - name: Librerías extra para Android
        run: |
          haxelib list | grep -q extension-androidtools || haxelib git extension-androidtools https://github.com/MAJigsaw77/extension-androidtools
          haxelib list | grep -q extension-haptics || haxelib install extension-haptics || true
          
          echo "Creando stub completo para extension-firebase-crashlytics..."
          mkdir -p /tmp/dummy-crashlytics/extension/firebase
          echo '{"name": "extension-firebase-crashlytics", "version": "1.0.0", "classPath": "", "dependencies": {}}' > /tmp/dummy-crashlytics/haxelib.json
          cat << 'EOF' > /tmp/dummy-crashlytics/extension/firebase/Crashlytics.hx
          package extension.firebase;
          class Crashlytics {
              public static function initialize():Void {}
              public static function log(m:String):Void {}
              public static function recordError(e:Dynamic, ?s:Dynamic):Void {}
              public static function sendCrashData(e:Dynamic, ?s:Dynamic):Void {}
              public static function setUserId(id:String):Void {}
              public static function setCustomKey(k:String, v:Dynamic):Void {}
              public static function setCrashlyticsCollectionEnabled(b:Bool):Void {}
          }
          EOF
          haxelib dev extension-firebase-crashlytics /tmp/dummy-crashlytics
          
          haxelib list | grep -q hxvlc || haxelib install hxvlc || true
          haxelib list

      - name: Aplicar capa P-Hslice
        run: python3 scripts/apply_overlay.py --target pslice

      - name: Parchear incompatibilidades de código en P-Hslice
        run: |
          sed -i 's/m\.closeAll()/closeAll()/g' pslice/source/phslice/ui/Menu.hx || true
          sed -i 's/c\.setFilters(\[\])/c.filters = \[\]/g' pslice/source/phslice/PotatoMode.hx || true

      - name: Crear google-services.json falso para Firebase
        run: |
          echo '{
            "project_info": {
              "project_number": "1234567890",
              "project_id": "dummy-phslice"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:1234567890:android:1234567890abcdef",
                "android_client_info": {
                  "package_name": "com.psych.slice"
                }
              },
              "api_key": [{"current_key": "AIzaSyDummyKeyForBuildOnly123456"}],
              "services": { "analytics_service": { "status": 1 } }
            }],
            "configuration_version": "1"
          }' > pslice/google-services.json

      - name: Configurar Lime para Android
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          haxelib run lime setup -alias -y || true
          haxelib run lime config ANDROID_SDK "$ANDROID_HOME"
          haxelib run lime config ANDROID_NDK_ROOT "${{ steps.ndk.outputs.ndk-path }}"
          haxelib run lime config JAVA_HOME "$JAVA_HOME"
          haxelib run lime config ANDROID_SETUP true
          haxelib run lime config

      - name: Compilar APK
        working-directory: pslice
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          haxelib run lime build android -final

      - name: Reunir APK
        run: |
          mkdir -p out
          find pslice/export -name "*.apk" -print
          i=0; for f in $(find pslice/export -name "*.apk"); do cp "$f" "out/P-Hslice-$i.apk"; i=$((i+1)); done
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: P-Hslice-APK
          path: out/*.apk
          if-no-files-found: error
          
